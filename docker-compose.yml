services:
  bot:
    build: .
    command: python -m app.bot.main
    restart: always
    env_file:
      - .env
    environment:
      # База лежить у ./data на хості, тому переживає перебілд і рестарт контейнера
      DATABASE_URL: sqlite+aiosqlite:////data/monitoring_db.sqlite
    volumes:
      - ./data:/data
